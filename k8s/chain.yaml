apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-c
spec:
  replicas: 1
  selector:
    matchLabels: { app: service-c }
  template:
    metadata:
      labels: { app: service-c }
    spec:
      containers:
        - name: service-c
          image: localhost:5000/service-c:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata:
  name: service-c
spec:
  selector: { app: service-c }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b
spec:
  replicas: 1
  selector:
    matchLabels: { app: service-b }
  template:
    metadata:
      labels: { app: service-b }
    spec:
      containers:
        - name: service-b
          image: localhost:5000/service-b:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }]
          env:
            - name: NEXT_URL
              value: "http://service-c:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: service-b
spec:
  selector: { app: service-b }
  ports: [{ port: 8081, targetPort: 8081 }]
          
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-a
spec:
  replicas: 1
  selector:
    matchLabels: { app: service-a }
  template:
    metadata:
      labels: { app: service-a }
    spec:
      containers:
        - name: service-a
          image: localhost:5000/service-a:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }]
          env:
            - name: NEXT_URL
              value: "http://service-b:8081"
          
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
spec:
  type: NodePort
  selector: { app: service-a }
  ports: [{ port: 8082, targetPort: 8082, nodePort: 30082 }]
